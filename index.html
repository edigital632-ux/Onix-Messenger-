<!DOCTYPE html>
<html lang="pt-br">
<head>
  <title>Bomberman Battle Online - Zapia</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; touch-action: manipulation; user-select: none; }
    body { margin: 0; background: #1a1a1a; color: white; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; }
    #lobby { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px; overflow-y: auto; }
    #canvas-container { position: relative; width: 100%; max-width: 600px; aspect-ratio: 15/13; }
    canvas { width: 100%; height: auto; background: #2e7d32; border: 4px solid #fff; image-rendering: pixelated; display: block; transition: background 1s ease; }
    .controls { width: 100%; max-width: 600px; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
    .dpad { display: grid; grid-template-columns: repeat(3, 60px); gap: 5px; }
    .btn { width: 60px; height: 60px; background: #444; border: 2px solid #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; cursor: pointer; }
    .btn:active { background: #666; }
    .btn-bomb { width: 85px; height: 85px; border-radius: 50%; background: #d32f2f; font-weight: bold; border: 4px solid #fff; cursor: pointer; }
    .btn-bomb:active { background: #ff5252; }
    input { padding: 10px; margin: 5px; border-radius: 5px; width: 220px; text-align: center; border: 2px solid #555; font-family: inherit; background: #222; color: #fff; }
    button#join-btn { padding: 15px 30px; background: #f44336; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
    button#join-btn:disabled { background: #777; cursor: default; }
    #status { padding: 10px; color: #ffeb3b; min-height: 24px; }
    
    #scoreboard { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; max-width: 600px; padding: 8px 15px; font-weight: bold; font-size: 16px; text-transform: uppercase; background: #222; border: 2px solid #555; margin-bottom: 5px; border-radius: 5px; }
    .score-side { display: flex; align-items: center; }
    
    #lobby-error { color: #ff5252; font-size: 13px; min-height: 18px; margin-top: 5px; }
    #room-share { font-size: 12px; color: #9ccc65; margin-top: 4px; }
    #event-log { font-size: 12px; color: #80d8ff; min-height: 18px; margin-top: 2px; transition: opacity 0.3s; }
    #phase-banner { font-size: 14px; color: #fff176; min-height: 18px; margin-top: 2px; }

    #ranking-box { margin-top: 25px; background: #222; border: 2px dashed #ffeb3b; padding: 15px; width: 320px; border-radius: 5px; text-align: left; }
    #ranking-box h3 { margin: 0 0 10px 0; text-align: center; color: #ffeb3b; font-size: 16px; letter-spacing: 1px; }
    .ranking-item { display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin-bottom: 6px; padding: 4px; border-bottom: 1px solid #333;}
    .ranking-item.rank-1 { color: #ffd700; font-weight: bold; }
    .ranking-item.rank-2 { color: #e0e0e0; }
    .ranking-item.rank-3 { color: #cd7f32; }
    
    /* Destaque para o Campeão (5 vitórias ou mais) */
    .champion { color: #00e676 !important; font-weight: bold; text-shadow: 0 0 5px rgba(0, 230, 118, 0.5); background: rgba(0, 230, 118, 0.1); border-radius: 4px; border-bottom: none; }

    /* Times / Duplas */
    #team-box { width: 100%; max-width: 600px; padding: 6px 15px; display: none; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; background: #222; border: 2px solid #555; border-radius: 5px; margin-bottom: 5px; font-size: 13px; }
    #team-box button { background: #455a64; color: #fff; border: 1px solid #777; border-radius: 4px; padding: 6px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
    #team-box button:active { background: #607d8b; }
    .team-tag { padding: 2px 6px; border-radius: 3px; font-size: 11px; margin-left: 4px; }
    .team-A { background: #1565c0; color: #fff; }
    .team-B { background: #c62828; color: #fff; }

    /* Chat */
    #chat-box { width: 100%; max-width: 600px; background: transparent; border: none; margin-bottom: 5px; display: flex; flex-direction: column; }
    #chat-log { height: 90px; overflow: hidden; font-size: 12px; padding: 4px 8px; display: flex; flex-direction: column-reverse; gap: 3px; pointer-events: none; }
    #chat-log div { word-break: break-word; background: rgba(0,0,0,0.55); padding: 3px 8px; border-radius: 4px; display: inline-block; max-width: 100%; transition: opacity 0.6s ease; }
    #chat-input-row { display: flex; border-top: 1px solid #444; background: #181818; border-radius: 5px; border: 2px solid #555; }
    #chat-input { flex: 1; border: none; border-radius: 0; background: #222; color: #fff; padding: 8px; font-size: 13px; margin: 0; width: auto; }
    #chat-send { background: #2e7d32; color: #fff; border: none; padding: 8px 14px; cursor: pointer; font-family: inherit; font-size: 13px; }
    #chat-send:active { background: #43a047; }

    /* Status de efeitos (escudo / invisibilidade) */
    #effects-status { font-size: 12px; min-height: 16px; margin-top: 2px; }
    .effect-shield { color: #29b6f6; }
    .effect-invis { color: #ab47bc; }
  </style>
</head>
<body>

  <div id="lobby">
    <h1>BOMBERMAN ONLINE</h1>
    <input type="text" id="p-name" placeholder="Seu Nome" maxlength="10">
    <input type="text" id="r-id" placeholder="ID da Sala (ex: sala1)">
    <button id="join-btn">ENTRAR NO JOGO</button>
    <p id="lobby-error"></p>
    <p style="font-size: 12px; margin-top: 10px;">O jogo inicia de 2 a 4 jogadores.</p>

    <div id="ranking-box">
      <h3>🏆 TOP 5 GLOBAIS 🏆</h3>
      <div id="ranking-list">Carregando placar...</div>
    </div>
  </div>

  <div id="status">Conecte-se para jogar</div>
  
  <div id="scoreboard">
    <div id="score-p1" class="score-side"></div>
    <div id="score-p2" class="score-side" style="justify-content: flex-end;"></div>
    <div id="score-p3" class="score-side"></div>
    <div id="score-p4" class="score-side" style="justify-content: flex-end;"></div>
  </div>

  <div id="team-box"></div>

  <div id="room-share"></div>
  <div id="phase-banner"></div>
  <div id="event-log"></div>
  <div id="effects-status"></div>

  <div id="canvas-container">
    <canvas width="960" height="832" id="game"></canvas>
  </div>

  <div id="chat-box">
    <div id="chat-log"></div>
    <div id="chat-input-row">
      <input type="text" id="chat-input" placeholder="Mensagem para a sala..." maxlength="80">
      <button id="chat-send">Enviar</button>
    </div>
  </div>

    </div>
    <div class="btn btn-bomb" id="bomb-btn">BOMBA</div>
  </div>

      p2_red_black: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAABb0lEQVR4nO1WvU7DMBC+IjxfhjBk61oJ6AswdUiFxMrOxjPxHkgonXmBAlLXbh7IEI+dzEKiq+Ozz6YVSz4pUmSf7/vuxz8AEyb8M2Y5ixDRcnPGmCSflznEVVWFzGyKkIsTkw/zoSxRiFQioo0R+6C1jmYimgFpJLnrRSXIiV66LiggN/WuiFAWxE14LkwC2IPIrZvWOtk57R9EtL4tKT4Ju10DAABXtw8AAPD98Xo07xtfrJ6ifr0CPpfLIfrHw0GqkcX7fN7/2pvt9igLo5RQcorrt5dk4q/7Z+84FSEuQbFYJwsgkbMQC5A4y8FoG7o1OjWiPUCBiJaL/G6/H42FbLlbMelB4qLruuG/KIosH8GT0Bgz80VKSfuPQyh6ANmDpEbEJqcJf8nXALDhbER3gVLKW/MYuVIqaifuASoilI3eRkIuEVC7IiiJDwxxDUwZYgI2rghK0rbtcDyWZdlE/HghakKBTQx/a8Jz4genVnLL75jYqwAAAABJRU5ErkJggg==",
      p3_purple_yellow: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAABf0lEQVR4nO1WMU7EMBCcQ7jeFEHKDxAND7gKmruGgh9QwA94BBU/ACF+QHFNruEqHkCD+MFJRCKuU4QCfDjJ2l6bO9FkpJMie70zO7txDhgx4p8xSTlERK1rT2sdlTMq2BDXLyfOmGy6ihKyt01ye9/nkg2RSiJqQ8Qcsukq6ETQAWklqedFLUipXnrOKyDV+r4InwviIdwVRgH7ro1+38wFEwN7foio5V5Jp4BBsrcSAHBwfAYA+HhddPbZ9c+bYF5WwN3hk1X9g1SjE7fF4/dDgfbq/bzjwsCSLvkvLp+LaOL70zW7bosQtyA7mkcL2FTugViAJFkKBq9hv0fbRnAGbBBR66r8en0xWPPFur6K4hZwqOt685xlWVIO702otZ5wldqk5ueCr3pA9odkRkRlyhD+kM8BLF0xom+BUorteYhcKRWME8+ALcLnhomRkAPhFswAIM/z0l5smsYr1EZVVeYGY9sQcmBpRHAkVvKBSCYPC9EQCmJC+NsQ7hJfSQ2BMKrM/eIAAAAASUVORK5CYII=",
      p4_green_white: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAABZElEQVR4nO2WPU7DQBCFXxBbjwtzCBpaKgqapAkS3IBjcASOwQ1AIo3TUFDR0nAIXHhrF6Zh0STe2ZndOKLxJ0WKdmd33vx4bGBm5p9ZlBwiokHa895n3ZllHBx3XSfaVFWVJeRkSud8P5WlbIhoKMEiQs3AoZFo500l0NI+9bk/SlOfUwpzEx6LWcCptLFftzBgcuBNSERDbDiJAkaXfTUAgLOLNQDg+3Ozsy+ta0QFrJ9vp5tiAK6ersPfYXP3spOFUUok56+XD9mObz4eo+tchLkE1fkqWwCLXMQswHJZCaPHcL9GU6P2AIeIBiny9/u30VrKVvo+MJcgBn/OS+YEoExC7/0iFil3Gn4SqegB2yfZkoiakib8db4CsJVsTO8C51y05ppz55xqZ+4BLiKVjWBjcQ7oJVgCQF3XDV/s+z4plNO2bZhg0TJoGdgGETEn7PKRyMg9UUxNaLDROKwJj8kP20bx/Ff51ZkAAAAASUVORK5CYII=",
      wall: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAlklEQVR4nO2Xuw2AMAxED+Q5PARkBiQa9mEClgOG8CJQ0AQUPgoCN3ddolh+in35FE3bLXCUVHWAqvYeyc1sKD0Sx5J4YGbDccE8jajqkJ3gLt59BwjgDiDzNEJVAWwNk9LZ/FNdxe9ckNPtb13iXgICEMAdYGfDXL+/OSck9nDKz7wNCUCAr8X3gHsJCEAAAdJ/wr+0AgZVOj9xHN3wAAAAAElFTkSuQmCC",
      block: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAABmElEQVR4nMWXMW7DMAxFmaIHSLRkT4EOPoEHLz1H154gB/EJuvYcXTLkBBoKtLsX2TdIl0qhGFKk1KImYDiGFP9nkqKoDQBcYEW7W1McAOA+/ujHgZ2w3e9gmebqFwcfwHVOHD8fTzkAFZWeSzDBB/FZgrkJARW3jlNx63gGoInXzrNYdRIu08yGoRTvPwPQklGD4MKQADS3LtMM5+PpuThJgeDGEkDp67D4byFEAM36cXjDd84scM0AVvF4p14w1QEuDNYqyHnIdS5dkt14gApyySm5uuQhM0CEkNZ7TTI2AwBc1yyFkJKxFWgDP/1APw5sobAsKSxuDUPcDZMHpM0i+KB+XWmJbve77KKmLsOPV2+KORYvzaUQKsDjS6cWIGyWJMUQpkIUISQxbDgclm27uScsfWlNPTAD0CTV9gZr01LlgeBDBsKJBx+qOqbUlLrOqX0dFin97+v9Ew5PD3UA8WVYhD5rMNGs4gCFELT2eBbD5f3fT0Z0b2EPJpxZc8R1LhPRTlZVHtDCwo1rDU3aDdey1U/H35bf2Tr3H9cuAAAAAElFTkSuQmCC",
    };

    // Carrega as imagens dos sprites em memória (decodifica o base64 uma única vez)
    const SPRITE_IMAGES = {};
    let spritesLoadedCount = 0;
    const SPRITE_KEYS = Object.keys(SPRITE_DATA);
    SPRITE_KEYS.forEach(key => {
      const img = new Image();
      img.onload = () => { spritesLoadedCount++; };
      img.src = SPRITE_DATA[key];
      SPRITE_IMAGES[key] = img;
    });
    const PLAYER_SPRITE_BY_SLOT = ['p1_white_blue', 'p2_red_black', 'p3_purple_yellow', 'p4_green_white'];

    // Canvas auxiliar (offscreen) usado para tingir a parede com a cor da fase atual,
    // preservando a textura de pedra do sprite e a variação de cor por fase pedida anteriormente.
    const tintCanvas = document.createElement('canvas');
    tintCanvas.width = 32; tintCanvas.height = 32;
    const tintCtx = tintCanvas.getContext('2d');
    function getTintedWallTile(color) {
      tintCtx.clearRect(0, 0, 32, 32);
      tintCtx.drawImage(SPRITE_IMAGES.wall, 0, 0, 32, 32);
      tintCtx.globalCompositeOperation = 'multiply';
      tintCtx.fillStyle = color;
      tintCtx.fillRect(0, 0, 32, 32);
      tintCtx.globalCompositeOperation = 'destination-in';
      tintCtx.drawImage(SPRITE_IMAGES.wall, 0, 0, 32, 32);
      tintCtx.globalCompositeOperation = 'source-over';
      return tintCanvas;
    }

    
    // Paletas de cores das fases — o bloco destrutível ('S') é SEMPRE preto e nunca muda.
    // Só variam o fundo e a parede indestrutível ('W'), sempre bem distintas entre si,
    // bem contrastantes com o preto do bloco, e nunca se repetem entre fases.
    const PHASE_VISUALS = [
      { bg: '#2e7d32', wall: '#1b5e20' }, // 1: Floresta (Verde)
      { bg: '#0277bd', wall: '#01579b' }, // 2: Gelo (Azul)
      { bg: '#ad1457', wall: '#880e4f' }, // 3: Magma (Rosa-fogo)
      { bg: '#6a1b9a', wall: '#4a148c' }, // 4: Sombrio (Roxo)
      { bg: '#ef6c00', wall: '#bf360c' }, // 5: Deserto (Laranja-terra)
      { bg: '#00838f', wall: '#006064' }, // 6: Caverna (Ciano)
      { bg: '#558b2f', wall: '#33691e' }, // 7: Pântano (Verde-oliva)
      { bg: '#5d4037', wall: '#3e2723' }  // 8: Terra (Marrom)
    ];
    const BLOCK_COLOR = '#000000'; // cor fixa do bloco destrutível — nunca muda
    const FIRE_OUTER = 'rgba(255, 140, 0, 0.75)';  // laranja — fixo, nunca muda
    const FIRE_INNER = 'rgba(255, 235, 59, 0.9)';  // amarelo claro — fixo, nunca muda

    const joinBtn = document.getElementById('join-btn');
    const lobbyError = document.getElementById('lobby-error');

    // LISTENER DO RANKING - CORRIGIDO PARA 5 VITÓRIAS
    db.ref('leaderboard').on('value', snap => {
      const listEl = document.getElementById('ranking-list');
      const data = snap.val() || {};
      
      const sorted = Object.entries(data)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5); 
      
      if (sorted.length === 0) {
        listEl.innerHTML = '<div style="text-align:center;color:#777;">Nenhuma vitória ainda</div>';
        return;
      }

      const medals = ['🥇', '🥈', '🥉'];

      listEl.innerHTML = sorted.map(([name, score], idx) => {
        const isChampion = score >= 5; // Apenas 5 vitórias para brilhar
        const medal = medals[idx] || `${idx + 1}.`;
        let displayName = `${medal} ${name}`;
        
        if (isChampion) {
            displayName = `👑 ${name} (CAMPEÃO)`;
        }

        const rankClass = idx === 0 ? 'rank-1' : (idx === 1 ? 'rank-2' : (idx === 2 ? 'rank-3' : ''));

        return `
        <div class="ranking-item ${rankClass} ${isChampion ? 'champion' : ''}">
          <span>${displayName}</span>
          <span>${score} vit.</span>
        </div>
        `;
      }).join('');
    });

    function updateScoreboard() {
      const pArr = Object.values(players).sort((a, b) => a.slot - b.slot);
      
      for(let i = 0; i < 4; i++) {
        const el = document.getElementById(`score-p${i+1}`);
        if(!el) continue;
        
        if(pArr[i]) {
          const teamTag = pArr[i].team ? `<span class="team-tag team-${pArr[i].team}">${pArr[i].team}</span>` : '';
          if(i % 2 === 0) {
            el.innerHTML = `<span style="color:${pArr[i].color}">${pArr[i].name}</span>${teamTag}&nbsp; ${pArr[i].points || 0}`;
          } else {
            el.innerHTML = `${pArr[i].points || 0} &nbsp;<span style="color:${pArr[i].color}">${pArr[i].name}</span>${teamTag}`;
          }
        } else {
          el.innerHTML = '';
        }
      }

      updateTeamBox();
    }

    // ---------- DUPLAS / TIMES ----------
    // Só libera a formação de dupla quando a sala está com os 4 jogadores.
    function updateTeamBox() {
      const box = document.getElementById('team-box');
      const ids = Object.keys(players);
      if (ids.length < 4) {
        box.style.display = 'none';
        return;
      }
      box.style.display = 'flex';

      const me = players[myId];
      if (!me) { box.style.display = 'none'; return; }

      if (me.team) {
        const teammateId = ids.find(pid => pid !== myId && players[pid].team === me.team);
        const teammateName = teammateId ? players[teammateId].name : '...';
        box.innerHTML = `Você está no <span class="team-tag team-${me.team}">Time ${me.team}</span> com <b>${teammateName}</b> ` +
                         `<button id="leave-team-btn">Sair da Dupla</button>`;
        document.getElementById('leave-team-btn').onclick = () => {
          db.ref(`rooms/${myRoom}/players/${myId}`).update({ team: null });
        };
      } else {
        const others = ids.filter(pid => pid !== myId);
        const buttons = others.map(pid => {
          const p = players[pid];
          const label = p.team ? `${p.name} (ocupado)` : p.name;
          const disabled = p.team ? 'disabled style="opacity:0.4;"' : '';
          return `<button class="form-team-btn" data-pid="${pid}" ${disabled}>Formar dupla c/ ${label}</button>`;
        }).join('');
        box.innerHTML = `Formar dupla: ${buttons}`;
        box.querySelectorAll('.form-team-btn').forEach(btn => {
          btn.onclick = () => formTeamWith(btn.getAttribute('data-pid'));
        });
      }
    }

    function formTeamWith(otherId) {
      const other = players[otherId];
      if (!other || other.team) return;
      const usedTeams = new Set(Object.values(players).map(p => p.team).filter(Boolean));
      const teamName = usedTeams.has('A') ? 'B' : 'A';
      db.ref(`rooms/${myRoom}/players/${myId}`).update({ team: teamName });
      db.ref(`rooms/${myRoom}/players/${otherId}`).update({ team: teamName });
    }

    // ---------- CHAT (visível para a sala toda, colorido por time/jogador) ----------
    // Mensagens aparecem como num chat de jogo normal: ficam visíveis por um tempo e depois somem (fade out),
    // em vez de se acumularem fixas na tela.
    const CHAT_MESSAGE_LIFETIME_MS = 6000;
    const CHAT_FADE_MS = 600;
    const CHAT_MAX_VISIBLE = 5;

    function initChatListener() {
      if (chatInitialized) return;
      chatInitialized = true;
      const chatLog = document.getElementById('chat-log');

      roomRef.child('chat').limitToLast(30).on('child_added', snap => {
        const msg = snap.val();
        if (!msg) return;
        const line = document.createElement('div');
        line.style.color = msg.color || '#fff';
        const teamLabel = msg.team ? ` [Time ${msg.team}]` : '';
        line.textContent = `${msg.name}${teamLabel}: ${msg.text}`;
        chatLog.appendChild(line);

        // Mantém só as últimas CHAT_MAX_VISIBLE mensagens na tela
        while (chatLog.children.length > CHAT_MAX_VISIBLE) {
          chatLog.removeChild(chatLog.firstChild);
        }

        // Depois de um tempo, a mensagem some com fade e é removida
        setTimeout(() => {
          line.style.opacity = '0';
          setTimeout(() => { if (line.parentNode) line.parentNode.removeChild(line); }, CHAT_FADE_MS);
        }, CHAT_MESSAGE_LIFETIME_MS);
      });
    }

    function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !roomRef) return;
      const me = players[myId] || {};
      roomRef.child('chat').push({
        name: myName,
        text: text.slice(0, 80),
        color: me.color || '#fff',
        team: me.team || null,
        ts: firebase.database.ServerValue.TIMESTAMP
      });
      input.value = '';
    }

    document.getElementById('chat-send').onclick = sendChatMessage;
    document.getElementById('chat-input').addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter') { e.preventDefault(); sendChatMessage(); }
    });

    joinBtn.onclick = async () => {
      const nameInput = document.getElementById('p-name').value.trim();
      const roomVal = document.getElementById('r-id').value.trim();

      if (!roomVal) { lobbyError.innerText = 'Digite um ID da sala.'; return; }

      joinBtn.disabled = true;
      lobbyError.innerText = '';

      myName = nameInput || 'Bomber_' + Math.floor(Math.random() * 900 + 100);
      myRoom = roomVal;
      myId = 'p_' + Math.random().toString(36).substring(2, 9);

      try {
        roomRef = db.ref('rooms/' + myRoom);
        const snap = await roomRef.once('value');
        const existingData = snap.val() || {};
        const existingPlayers = existingData.players || {};
        const existingCount = Object.keys(existingPlayers).length;

        if (existingCount >= 4) {
          lobbyError.innerText = 'Sala cheia (Máximo 4 jogadores).';
          joinBtn.disabled = false;
          return;
        }

        if (!existingData.map) generateHardMap(roomRef, 1);

        const usedSlots = new Set(Object.values(existingPlayers).map(p => p.slot).filter(s => typeof s === 'number'));
        let slot = 0;
        while (usedSlots.has(slot) && slot < 4) slot++;
        if (slot >= 4) slot = existingCount % 4; 

        const spawn = SPAWNS[slot];
        const color = COLORS[slot];

        const myPlayerRef = roomRef.child('players/' + myId);
        await myPlayerRef.set({
          name: myName, r: spawn.r, c: spawn.c, alive: true, color: color, slot: slot, 
          bombRange: BASE_BOMB_RANGE, maxBombs: 1, points: 0, team: null,
          shieldUntil: 0, invisUntil: 0
        });
        myPlayerRef.onDisconnect().remove();

        roomRef.child('players').on('value', s => {
          const newPlayers = s.val() || {};
          detectPlayerEvents(newPlayers);
          players = newPlayers;
          updateScoreboard(); 
          
          const count = Object.keys(players).length;
          gameActive = count >= 2;
          
          if (count < 2) {
            document.getElementById('status').innerText = `Aguardando jogadores... (${count}/4)`;
          } else {
            document.getElementById('status').innerText = 'BATALHA!';
            checkRoundEnd();
          }
        });

        roomRef.child('map').on('value', s => { map = s.val() || []; });
        
        roomRef.child('phase').on('value', s => {
          const p = s.val();
          if (p && p !== currentPhase) {
            currentPhase = p;
            let leaderName = "Empate";
            let maxPoints = -1;
            Object.values(players).forEach(pl => {
                const pts = pl.points || 0;
                if (pts > maxPoints) { maxPoints = pts; leaderName = pl.name; }
                else if (pts === maxPoints) { leaderName = "Empate"; }
            });
            showPhaseBanner(`FASE ${currentPhase} - Ganhando: ${leaderName} 🏆`);
          } else if (p) { currentPhase = p; }
        });
        
        roomRef.child('bombs').on('value', s => {
          const newBombs = s.val() || {};
          handleBombSync(newBombs);
          bombs = newBombs;
        });

        roomRef.child('powerups').on('value', s => { powerups = s.val() || {}; });

        initChatListener();

        document.getElementById('lobby').style.display = 'none';
        document.getElementById('room-share').innerText = `Sala: ${myRoom} — compartilhe o ID`;

        if (!loopStarted) {
          loopStarted = true;
          requestAnimationFrame(loop);
          setInterval(tickBombs, 50); 
          setInterval(updateEffectsStatus, 200);
        }
      } catch (err) {
        lobbyError.innerText = 'Erro ao conectar.';
        joinBtn.disabled = false;
      }
    };

    function showEventMessage(msg) {
      const el = document.getElementById('event-log');
      el.innerText = msg;
      el.style.opacity = '1';
      if (eventLogTimeout) clearTimeout(eventLogTimeout);
      eventLogTimeout = setTimeout(() => { el.style.opacity = '0'; }, 3000);
    }

    function showPhaseBanner(msg) {
      const el = document.getElementById('phase-banner');
      el.innerText = msg;
      setTimeout(() => { if (el.innerText === msg) el.innerText = ''; }, 2500);
    }

    // Mostra o tempo restante dos efeitos ativos do jogador local (escudo / invisibilidade)
    function updateEffectsStatus() {
      const el = document.getElementById('effects-status');
      const me = players[myId];
      if (!me) { el.innerHTML = ''; return; }
      const now = getServerTime();
      const parts = [];
      if (me.shieldUntil && me.shieldUntil > now) {
        const secs = Math.ceil((me.shieldUntil - now) / 1000);
        parts.push(`<span class="effect-shield">🛡️ Colete: ${secs}s</span>`);
      }
      if (me.invisUntil && me.invisUntil > now) {
        const secs = Math.ceil((me.invisUntil - now) / 1000);
        parts.push(`<span class="effect-invis">👻 Invisível: ${secs}s</span>`);
      }
      el.innerHTML = parts.join(' &nbsp; ');
    }

    function detectPlayerEvents(newPlayers) {
      const newIds = new Set(Object.keys(newPlayers));
      newIds.forEach(pid => {
        if (!knownPlayerIds.has(pid) && knownPlayerIds.size > 0 && pid !== myId) {
          showEventMessage(`${newPlayers[pid].name} entrou na sala`);
        }
      });
      knownPlayerIds.forEach(pid => {
        if (!newIds.has(pid)) {
          const leftName = (players[pid] && players[pid].name) || 'Jogador';
          showEventMessage(`${leftName} saiu da sala`);
        }
      });
      knownPlayerIds = newIds;
    }

    // AUMENTO PROGRESSIVO DA QUANTIDADE DE BLOCOS POR FASE
    function generateHardMap(ref, phaseNum) {
      let newMap = [];
      // A chance começa em 65% na fase 1 e aumenta até no máximo 95%
      const blockChance = Math.min(0.60 + (phaseNum * 0.05), 0.95);

      for (let r = 0; r < rows; r++) {
        newMap[r] = [];
        for (let c = 0; c < cols; c++) {
          if (r === 0 || r === rows - 1 || c === 0 || c === cols - 1 || (r % 2 === 0 && c % 2 === 0)) {
            newMap[r][c] = 'W';
          } else if ((r < 4 && c < 4) || (r > rows - 5 && c > cols - 5) || (r < 4 && c > cols - 5) || (r > rows - 5 && c < 4)) {
            newMap[r][c] = ' ';
          } else {
            newMap[r][c] = Math.random() < blockChance ? 'S' : ' ';
          }
        }
      }
      ref.child('map').set(newMap);
      ref.child('phase').set(phaseNum);
      ref.child('bombs').remove();
      ref.child('powerups').remove();
      localExplodedBombs.clear(); 
    }

    function startNextPhase() {
      const ids = Object.keys(players).sort();
      if (ids[0] !== myId) return;

      const nextPhase = currentPhase + 1;
      generateHardMap(roomRef, nextPhase);

      const shuffledSpawns = [...SPAWNS].sort(() => Math.random() - 0.5);

      ids.forEach((pid, index) => {
        const spawn = shuffledSpawns[index % 4];
        roomRef.child('players/' + pid).update({ 
            r: spawn.r, 
            c: spawn.c, 
            alive: true, 
            bombRange: BASE_BOMB_RANGE, 
            maxBombs: 1,
            shieldUntil: 0,
            invisUntil: 0
        });
      });
    }

    function checkRoundEnd() {
      const ids = Object.keys(players);
      if (ids.length < 2) return;
      const aliveCount = ids.filter(pid => players[pid].alive).length;
      
      if (aliveCount <= 1 && !myRespawnScheduled) {
        myRespawnScheduled = true;
        let roundWinnerName = null;
        
        if (aliveCount === 1) {
          const winnerId = ids.find(pid => players[pid].alive);
          roundWinnerName = players[winnerId].name;
          
          if (winnerId === myId) {
            const myCurrentPoints = players[myId].points || 0;
            db.ref(`rooms/${myRoom}/players/${myId}`).update({ points: myCurrentPoints + 1 });
            
            const safeName = myName.replace(/[\.\#\$\[\]]/g, "_");
            db.ref(`leaderboard/${safeName}`).transaction((currentWins) => {
              return (currentWins || 0) + 1;
            });
          }
        }
        showPhaseBanner(aliveCount === 1 ? `${roundWinnerName} venceu a rodada! Próxima fase...` : 'Empate! Próxima fase...');
        setTimeout(() => {
          startNextPhase();
          myRespawnScheduled = false;
        }, RESPAWN_DELAY_MS);
      }
    }

    function isBombAt(r, c) {
      return Object.values(bombs).some(b => b.r === r && b.c === c && b.state !== 'exploding');
    }

    function move(dr, dc) {
      const me = players[myId];
      if (!gameActive || !me || !me.alive) return;
      const nr = me.r + dr, nc = me.c + dc;
      if (!map || !map[nr] || map[nr][nc] !== ' ') return;
      if (isBombAt(nr, nc)) return; 

      db.ref(`rooms/${myRoom}/players/${myId}`).update({ r: nr, c: nc });

      const pid = `pu_${nr}_${nc}`;
      const pu = powerups[pid];
      if (pu) {
        if (pu.type === 'amount') {
          const currentMax = me.maxBombs || 1;
          db.ref(`rooms/${myRoom}/players/${myId}`).update({ maxBombs: currentMax + 1 });
          showEventMessage('+1 Bomba Extra! 💣');
        } else if (pu.type === 'shield') {
          db.ref(`rooms/${myRoom}/players/${myId}`).update({ shieldUntil: getServerTime() + SHIELD_DURATION_MS });
          showEventMessage('Colete à prova de bomba! 🛡️ (30s)');
        } else if (pu.type === 'invis') {
          db.ref(`rooms/${myRoom}/players/${myId}`).update({ invisUntil: getServerTime() + INVIS_DURATION_MS });
          showEventMessage('Você ficou invisível! 👻 (30s)');
        } else {
          // LÓGICA DE ALCANCE: Quanto mais pega, maior o range da explosão de forma infinita
          const currentRange = me.bombRange || BASE_BOMB_RANGE;
          db.ref(`rooms/${myRoom}/players/${myId}`).update({ bombRange: currentRange + 1 });
          showEventMessage('Poder de fogo aumentado! 🔥');
        }
        db.ref(`rooms/${myRoom}/powerups/${pid}`).remove();
      }
    }

    function placeBomb() {
      const me = players[myId];
      if (!gameActive || !me || !me.alive) return;
      const { r, c } = me;
      const bid = `b_${myId}_${Date.now()}`;
      
      if (isBombAt(r, c)) return; 

      const myActiveBombs = Object.values(bombs).filter(b => b.owner === myId && b.state === 'ticking');
      const myMaxBombs = me.maxBombs || 1; 

      if (myActiveBombs.length >= myMaxBombs) return;

      db.ref(`rooms/${myRoom}/bombs/${bid}`).set({
        r, c, owner: myId, range: me.bombRange || BASE_BOMB_RANGE, plantedAt: firebase.database.ServerValue.TIMESTAMP, state: 'ticking'
      });
    }

    function tickBombs() {
      const serverNow = getServerTime(); 
      const me = players[myId];
      if (!me) return;

      Object.entries(bombs).forEach(([bid, b]) => {
        if (!b.plantedAt) return; 
        
        const ids = Object.keys(players).sort();
        const responsible = players[b.owner] ? b.owner : ids[0];
        const iAmResponsible = (responsible === myId);

        if (b.state === 'ticking' && serverNow - b.plantedAt >= BOMB_FUSE_MS) {
          if (iAmResponsible && !processedBombIds.has(bid)) {
            processedBombIds.add(bid);
            triggerExplosion(bid, b);
          }
        } 
        else if (b.state === 'exploding' && b.explodedAt && serverNow - b.explodedAt >= EXPLOSION_VISIBLE_MS) {
          if (iAmResponsible) {
            db.ref(`rooms/${myRoom}/bombs/${bid}`).remove();
          }
        }
      });
    }

    function triggerExplosion(bid, b) {
      const r = b.r, c = b.c, bombRange = b.range || BASE_BOMB_RANGE;
      const directions = [{ dr: 0, dc: 0 }, { dr: 1, dc: 0 }, { dr: -1, dc: 0 }, { dr: 0, dc: 1 }, { dr: 0, dc: -1 }];
      const hitCells = [];
      const blocksToDestroy = [];

      directions.forEach(({ dr, dc }) => {
        if (dr === 0 && dc === 0) {
          hitCells.push({ r, c });
          return;
        }
        for (let step = 1; step <= bombRange; step++) {
          const nr = r + dr * step, nc = c + dc * step;
          if (!map[nr] || map[nr][nc] === undefined) break; 
          if (map[nr][nc] === 'W') break; 

          hitCells.push({ r: nr, c: nc });

          if (map[nr][nc] === 'S') {
            blocksToDestroy.push({ r: nr, c: nc });
            break; 
          }
        }
      });

      db.ref(`rooms/${myRoom}/bombs/${bid}`).update({
         state: 'exploding',
         hitCells: hitCells,
         explodedAt: firebase.database.ServerValue.TIMESTAMP
      });

      blocksToDestroy.forEach(block => {
        db.ref(`rooms/${myRoom}/map/${block.r}/${block.c}`).set(' ');
        if (Math.random() < POWERUP_SPAWN_CHANCE) {
          const puType = pickPowerupType();
          db.ref(`rooms/${myRoom}/powerups/pu_${block.r}_${block.c}`).set({ r: block.r, c: block.c, type: puType });
        }
      });
    }

    // Sorteia o tipo de power-up: mantém a alternância original entre poder de fogo / bomba extra,
    // e adiciona uma chance menor para os itens especiais (colete e invisibilidade).
    function pickPowerupType() {
      const roll = Math.random();
      if (roll < 0.15) return 'shield';
      if (roll < 0.25) return 'invis';
      powerupAlternator = powerupAlternator === 'range' ? 'amount' : 'range';
      return powerupAlternator;
    }

    function handleBombSync(newBombs) {
      Object.keys(bombs).forEach(bid => {
        if (!newBombs[bid]) {
            processedBombIds.delete(bid);
            localExplodedBombs.delete(bid);
        }
      });
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // APLICAÇÃO DINÂMICA DA PALETA DE CORES DA FASE
      // O bloco destrutível ('S') usa sempre BLOCK_COLOR (preto fixo); só fundo/parede mudam por fase.
      const visual = PHASE_VISUALS[(currentPhase - 1) % PHASE_VISUALS.length];
      canvas.style.backgroundColor = visual.bg;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (map[r] && map[r][c] === 'W') { 
              if (spritesLoadedCount >= SPRITE_KEYS.length) {
                const tinted = getTintedWallTile(visual.wall);
                ctx.drawImage(tinted, c * grid, r * grid, grid, grid);
              } else {
                ctx.fillStyle = visual.wall; 
                ctx.fillRect(c * grid, r * grid, grid, grid); 
              }
          }
          else if (map[r] && map[r][c] === 'S') { 
              if (spritesLoadedCount >= SPRITE_KEYS.length) {
                ctx.drawImage(SPRITE_IMAGES.block, c * grid + 2, r * grid + 2, grid - 4, grid - 4);
              } else {
                ctx.fillStyle = BLOCK_COLOR; 
                ctx.fillRect(c * grid + 2, r * grid + 2, grid - 4, grid - 4); 
              }
          }
        }
      }

      const pulse = 0.85 + 0.15 * Math.sin(Date.now() / 200);
      
      Object.values(powerups).forEach(p => {
        let color = '#ffca28';
        let icon = '🔥';
        if (p.type === 'amount') { color = '#29b6f6'; icon = '💣'; }
        else if (p.type === 'shield') { color = '#00e5ff'; icon = '🛡️'; }
        else if (p.type === 'invis') { color = '#ab47bc'; icon = '👻'; }

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc((p.c + 0.5) * grid, (p.r + 0.5) * grid, grid * 0.28 * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(icon, (p.c + 0.5) * grid, (p.r + 0.65) * grid);
        ctx.textAlign = 'left';
      });

      const serverNow = getServerTime(); 
      
      Object.entries(bombs).forEach(([bid, b]) => {
        if (b.state === 'exploding' && b.hitCells) {
            b.hitCells.forEach(cell => {
                ctx.fillStyle = FIRE_OUTER;
                ctx.fillRect(cell.c * grid, cell.r * grid, grid, grid);
                ctx.fillStyle = FIRE_INNER;
                ctx.fillRect(cell.c * grid + 10, cell.r * grid + 10, grid - 20, grid - 20);
            });

            if (!localExplodedBombs.has(bid)) {
                localExplodedBombs.add(bid);
                const me = players[myId];
                if (me && me.alive) {
                    const hit = b.hitCells.some(c => c.r === me.r && c.c === me.c);
                    const shielded = me.shieldUntil && me.shieldUntil > serverNow;
                    if (hit && !shielded) { db.ref(`rooms/${myRoom}/players/${myId}`).update({ alive: false }); }
                }
            }
        } else if (b.state === 'ticking') {
            const elapsed = b.plantedAt ? serverNow - b.plantedAt : 0;
            const pulsing = elapsed > (BOMB_FUSE_MS - 800);
            ctx.fillStyle = pulsing ? '#ff5252' : '#000';
            ctx.beginPath();
            ctx.arc((b.c + 0.5) * grid, (b.r + 0.5) * grid, grid * 0.4, 0, Math.PI * 2);
            ctx.fill();
        }
      });

      ctx.font = '16px Courier New';
      Object.values(players).forEach(p => {
        if (!p.alive) return;

        const isMe = (p === players[myId]);
        const invisActive = p.invisUntil && p.invisUntil > serverNow;
        // Jogador invisível só permanece visível para si mesmo (semi-transparente); para os demais, desaparece.
        if (invisActive && !isMe) return;

        const shielded = p.shieldUntil && p.shieldUntil > serverNow;

        ctx.save();
        if (invisActive && isMe) ctx.globalAlpha = 0.45;

        if (shielded) {
          ctx.strokeStyle = '#00e5ff';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc((p.c + 0.5) * grid, (p.r + 0.5) * grid, grid * 0.42, 0, Math.PI * 2);
          ctx.stroke();
        }

        const spriteKey = PLAYER_SPRITE_BY_SLOT[p.slot] || PLAYER_SPRITE_BY_SLOT[0];
        const sprite = SPRITE_IMAGES[spriteKey];
        if (sprite && spritesLoadedCount >= SPRITE_KEYS.length) {
          ctx.drawImage(sprite, p.c * grid + 4, p.r * grid + 2, grid - 8, grid - 8);
        } else {
          // Fallback enquanto o sprite carrega: círculo de cor sólida (comportamento antigo)
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc((p.c + 0.5) * grid, (p.r + 0.5) * grid, grid * 0.35, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#fff';
        ctx.fillText(p.name, p.c * grid + 10, p.r * grid);
        ctx.restore();
      });

      requestAnimationFrame(loop);
    }

    const bind = (id, f) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', e => { e.preventDefault(); f(); });
      el.addEventListener('mousedown', f);
    };
    bind('up', () => move(-1, 0));
    bind('down', () => move(1, 0));
    bind('left', () => move(0, -1));
    bind('right', () => move(0, 1));
    bind('bomb-btn', placeBomb);

    document.addEventListener('keydown', e => {
      if (document.activeElement && document.activeElement.id === 'chat-input') return;
      if (e.key === 'ArrowUp') move(-1, 0);
      if (e.key === 'ArrowDown') move(1, 0);
      if (e.key === 'ArrowLeft') move(0, -1);
      if (e.key === 'ArrowRight') move(0, 1);
      if (e.key === ' ') placeBomb();
    });
  </script>
</body>
</html>
